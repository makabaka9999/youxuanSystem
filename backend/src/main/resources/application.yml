server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: youxuan-platform-backend
  profiles:
    active: ${APP_ENV:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:youxuan_p0}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:youxuan}
    password: ${MYSQL_PASSWORD:youxuan_password}
    hikari:
      pool-name: youxuan-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.youxuan.platform: ${APP_LOG_LEVEL:INFO}

youxuan:
  security:
    jwt:
      issuer: ${JWT_ISSUER:youxuan-platform}
      secret: ${JWT_SECRET:replace-with-at-least-32-bytes-secret}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:120}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    password:
      strength: 12
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}

server:
  port: ${ORDER_SERVICE_PORT:8083}
spring:
  application:
    name: youxuan-order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8722}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:youxuan_p0}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:2}
    timeout: ${REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

logging:
  file:
    path: ${LOG_PATH:logs}
    name: ${LOG_PATH:logs}/youxuan-order-service.log

youxuan:
  order:
    jobs:
      timeout-close-cron: ${ORDER_TIMEOUT_CLOSE_CRON:0 */1 * * * ?}
  mq:
    queue:
      # 订单事件队列
      order:
        created: youxuan.order.created.queue
        paid: youxuan.order.paid.queue
        shipped: youxuan.order.shipped.queue
        canceled: youxuan.order.canceled.queue
      # 支付事件队列
      payment:
        created: youxuan.payment.created.queue
        success: youxuan.payment.success.queue
        failed: youxuan.payment.failed.queue

# Dubbo RPC 配置
dubbo:
  application:
    name: ${spring.application.name}
    qos-port: ${DUBBO_QOS_PORT:22223}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20883}
  scan:
    base-packages: com.youxuan

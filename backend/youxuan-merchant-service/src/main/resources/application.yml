server:
  port: ${MERCHANT_SERVICE_PORT:8084}
spring:
  application:
    name: youxuan-merchant-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8723}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:youxuan_p0}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 启用 JWT 认证过滤链，签名密钥必须与 auth-service 的 youxuan.auth.security.secret 一致
youxuan:
  auth:
    jwt:
      enabled: true
      secret: ${JWT_SECRET:replace-with-at-least-32-bytes-secret}

logging:
  file:
    path: ${LOG_PATH:logs}
    name: ${LOG_PATH:logs}/youxuan-merchant-service.log

# Dubbo RPC 配置
dubbo:
  application:
    name: ${spring.application.name}-rpc
    qos-port: ${DUBBO_QOS_PORT:22224}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20884}
  scan:
    base-packages: com.youxuan

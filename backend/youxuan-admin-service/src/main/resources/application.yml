server:
  port: ${ADMIN_SERVICE_PORT:8086}
spring:
  application:
    name: youxuan-admin-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8725}
  datasource:
    url: ${ADMIN_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/youxuan_p0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${ADMIN_DATASOURCE_USERNAME:root}
    password: ${ADMIN_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
      idle-timeout: ${DATASOURCE_IDLE_TIMEOUT:300000}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT:10000}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS

logging:
  file:
    path: ${LOG_PATH:logs}
    name: ${LOG_PATH:logs}/youxuan-admin-service.log

# Dubbo RPC 配置
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20886}
  scan:
    base-packages: com.youxuan

server:
  port: ${FINANCE_SERVICE_PORT:8085}
spring:
  application:
    name: youxuan-finance-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8724}
  datasource:
    url: ${FINANCE_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/youxuan_p0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${FINANCE_DATASOURCE_USERNAME:root}
    password: ${FINANCE_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
      idle-timeout: ${DATASOURCE_IDLE_TIMEOUT:300000}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT:10000}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss.SSS
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:3}
    timeout: ${REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

logging:
  file:
    path: ${LOG_PATH:logs}
    name: ${LOG_PATH:logs}/youxuan-finance-service.log

youxuan:
  finance:
    jobs:
      daily-bill-cron: ${FINANCE_DAILY_BILL_CRON:0 10 0 * * ?}
      reconciliation-cron: ${FINANCE_RECONCILIATION_CRON:0 30 1 * * ?}
      settlement-cron: ${FINANCE_SETTLEMENT_CRON:0 0 2 * * ?}

# Dubbo RPC 配置
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20885}
  qos:
    port: ${DUBBO_QOS_PORT:22225}
  scan:
    base-packages: com.youxuan
